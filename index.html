<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>MathPro AI</title>
    <link rel="stylesheet" href="style.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
    <main class="chat-container">
        <header>
            <img src="logo.png" alt="Logo Douma Ali Mathématiques" class="brand-logo">
            <div>
                <h1>MathPro AI</h1>
                <p>Votre assistant de mathématiques</p>
            </div>
        </header>

        <section id="chat-box" class="chat-box" aria-live="polite">
            <div class="message bot">
                Bonjour 👋<br>
                Je suis <strong>Douma Ali</strong>.<br>
                Écrivez une question ou envoyez une image/PDF d’un exercice.
            </div>
        </section>

        <section class="composer" aria-label="Envoyer une question">
            <div id="attachment-preview" class="attachment-preview" hidden>
                <img id="image-preview" alt="Aperçu du document" hidden>
                <span id="file-icon" class="file-icon" aria-hidden="true">📄</span>
                <div class="file-meta">
                    <strong id="file-name"></strong>
                    <span id="file-size"></span>
                </div>
                <button id="remove-file" class="remove-file" type="button" aria-label="Supprimer le fichier">×</button>
            </div>

            <div class="input-area">
                <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
                <button id="attach-btn" class="icon-btn" type="button" title="Ajouter une image ou un PDF" aria-label="Ajouter une image ou un PDF"><span aria-hidden="true" style="font-size: 30px; font-weight: 400; line-height: 1;">+</span></button>
                <input type="text" id="user-input" placeholder="Écrivez votre question…" autocomplete="off">
                <button id="send-btn" type="button">Envoyer</button>
            </div>
            <p class="upload-help">Formats : JPG, PNG, WEBP ou PDF — 15 Mo maximum</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
