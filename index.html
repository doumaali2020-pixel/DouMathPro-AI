<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPro AI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Configuration unique de MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    
    <!-- Scripts CDN (MathJax + MarkedJS) -->
    <script id="mathjax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        header h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0;
        }

        .logo {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .latex-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .latex-block {
            display: none;
            background: #282c34;
            color: #abb2bf;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 10px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <header>
            <h1>
                <img src="logo.png"
                     alt="Logo Douma Ali Mathématiques"
                     class="logo">
                MathPro AI
            </h1>

            <p> Votre Assistant  de  mathématique</p>
        </header>

        <div id="chat-box" class="chat-box">

            <div class="message bot">
                Bonjour 👋<br>
                Je suis Douma Ali.<br>
                Posez-moi une question de mathématiques.
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Écrivez votre question..."
            >

            <button id="send-btn">
                Envoyer
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
